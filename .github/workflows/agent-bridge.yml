name: Agent Bridge

on:
  push:
    branches: [main, agent-bridge-cli]
    paths:
      - "agent-bridge/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/agent-bridge.yml"
  pull_request:
    paths:
      - "agent-bridge/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/agent-bridge.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Test bridge
        working-directory: agent-bridge
        run: npm test
      - name: Check package
        working-directory: agent-bridge
        run: npm pack --dry-run
